<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">HeartNote</title>
  <desc id="d">HeartNote — interactive digital greeting cards, Hebrew-first, live at heartnote.co.il.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfaf7"/>
      <stop offset="1" stop-color="#f6ece6"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8917a"/>
      <stop offset="1" stop-color="#c9725c"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3c52"/>
      <stop offset="1" stop-color="#1c2639"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c7b8"/>
      <stop offset="1" stop-color="#e8917a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1c2639" flood-opacity="0.18"/>
    </filter>
    <path id="heart" d="M0 -14 C -6 -26 -26 -24 -26 -8 C -26 6 -10 16 0 26 C 10 16 26 6 26 -8 C 26 -24 6 -26 0 -14 Z"/>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .beat { animation: beat 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes beat { 0%,100% { transform: scale(1) } 15% { transform: scale(1.14) } 30% { transform: scale(1) } 45% { transform: scale(1.08) } }
      .float { animation: float 6s ease-in-out infinite; }
      .f2 { animation-delay: -2s } .f3 { animation-delay: -4s }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
      .rise { animation: rise 7s linear infinite; opacity: 0; }
      .r2 { animation-delay: 2.3s } .r3 { animation-delay: 4.6s }
      @keyframes rise { 0% { transform: translateY(0); opacity: 0 } 15% { opacity: .9 } 100% { transform: translateY(-260px); opacity: 0 } }
      .spin { animation: spin 9s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes spin { to { transform: rotate(360deg) } }
      @media (prefers-reduced-motion: reduce) { .beat, .float, .rise, .spin { animation: none; } .rise { opacity: .7 } }
    </style>
    <clipPath id="frame"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>
<g clip-path="url(#frame)">

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="1060" cy="110" r="240" fill="#e8917a" opacity="0.08"/>
  <circle cx="160" cy="400" r="200" fill="#2e3c52" opacity="0.05"/>

  <!-- Logo mark: heart + gear -->
  <g transform="translate(110 104)">
    <g transform="scale(1.5)"><use href="#heart" class="beat" fill="#f1e6e1" stroke="url(#coral)" stroke-width="3.4"/></g>
  </g>
  <g transform="translate(92 122)">
    <g class="spin">
      <circle r="13" fill="none" stroke="#1c2639" stroke-width="8" stroke-dasharray="5 3.2"/>
      <circle r="9" fill="#1c2639"/>
      <circle r="5" fill="#fdfaf7"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="160" y="124" class="sans" font-size="40" font-weight="800" fill="#1c2639" letter-spacing="-0.5">HeartNote</text>

  <text x="72" y="222" class="sans" font-size="54" font-weight="800" fill="#1c2639" letter-spacing="-1.5">Greeting cards that</text>
  <text x="72" y="282" class="sans" font-size="54" font-weight="800" fill="url(#coral)" letter-spacing="-1.5">come alive.</text>
  <text x="74" y="326" class="sans" font-size="21" fill="#4a5568">Animated, interactive cards, shared as a link. Hebrew-first, live in production.</text>

  <g class="sans" font-size="14" font-weight="600">
    <g transform="translate(74 352)"><rect width="104" height="32" rx="16" fill="#1c2639"/><text x="52" y="21" text-anchor="middle" fill="#fff">Next.js 14</text></g>
    <g transform="translate(188 352)"><rect width="104" height="32" rx="16" fill="#1c2639"/><text x="52" y="21" text-anchor="middle" fill="#fff">TypeScript</text></g>
    <g transform="translate(302 352)"><rect width="118" height="32" rx="16" fill="#1c2639"/><text x="59" y="21" text-anchor="middle" fill="#fff">PostgreSQL</text></g>
    <g transform="translate(430 352)"><rect width="150" height="32" rx="16" fill="#1c2639"/><text x="75" y="21" text-anchor="middle" fill="#fff">AWS · Terraform</text></g>
    <g transform="translate(590 352)"><rect width="168" height="32" rx="16" fill="url(#coral)"/><text x="84" y="21" text-anchor="middle" fill="#fff">● heartnote.co.il</text></g>
  </g>

  <!-- Floating cards -->
  <g class="float" filter="url(#shadow)">
    <g transform="translate(800 64) rotate(-8)">
      <rect width="190" height="250" rx="20" fill="url(#card1)"/>
      <circle cx="95" cy="98" r="46" fill="none" stroke="#e8917a" stroke-width="3" stroke-dasharray="4 6"/>
      <use href="#heart" fill="url(#coral)" transform="translate(95 100) scale(1.2)"/>
      <text x="95" y="182" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#fff">מזל טוב</text>
      <rect x="45" y="200" width="100" height="10" rx="5" fill="#ffffff" opacity="0.18"/>
      <rect x="60" y="218" width="70" height="10" rx="5" fill="#ffffff" opacity="0.12"/>
    </g>
  </g>
  <g class="float f2" filter="url(#shadow)">
    <g transform="translate(1062 96) rotate(7)">
      <rect width="180" height="236" rx="20" fill="#ffffff"/>
      <g transform="translate(90 92)">
        <circle r="54" fill="url(#card2)"/>
        <path d="M0 0 L0 -54 A54 54 0 0 1 46.8 -27 Z" fill="#1c2639" opacity="0.85"/>
        <path d="M0 0 L46.8 27 A54 54 0 0 1 0 54 Z" fill="#1c2639" opacity="0.6"/>
        <path d="M0 0 L-46.8 27 A54 54 0 0 1 -46.8 -27 Z" fill="#fff" opacity="0.55"/>
        <circle r="10" fill="#fff" stroke="#1c2639" stroke-width="3"/>
        <path d="M-7 -66 L7 -66 L0 -54 Z" fill="#1c2639"/>
      </g>
      <text x="90" y="186" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#1c2639">גלגל ההחלטות</text>
      <rect x="40" y="202" width="100" height="10" rx="5" fill="#e8917a" opacity="0.35"/>
    </g>
  </g>
  <g class="float f3" filter="url(#shadow)">
    <g transform="translate(905 300) rotate(4)">
      <rect width="170" height="96" rx="16" fill="#fff4ef" stroke="#e8917a" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="85" y="44" text-anchor="middle" class="sans" font-size="17" font-weight="700" fill="#c9725c">כרטיס גירוד</text>
      <rect x="30" y="58" width="110" height="18" rx="9" fill="#d9c9c2"/>
    </g>
  </g>

  <!-- Rising hearts -->
  <g transform="translate(830 400) scale(.45)"><use href="#heart" class="rise" fill="#e8917a"/></g>
  <g transform="translate(1180 420) scale(.35)"><use href="#heart" class="rise r2" fill="#c9725c"/></g>
  <g transform="translate(1000 430) scale(.55)"><use href="#heart" class="rise r3" fill="#f3c7b8"/></g>
</g>
</svg>
